apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.visionface'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.visionface"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // 얼굴 검출 + 눈 랜드마크 (온디바이스, 모델 APK 번들 — 오프라인 동작).
  implementation "com.google.mlkit:face-detection:16.1.7"
  // SFace 임베딩 (iOS CoreML과 동일 가중치 ONNX — 1-a에서 코사인 0.999995 검증).
  // 1.22.0+ : .so가 16KB 페이지 정렬로 빌드됨(Play 2025.11 필수요건). 1.19.2는 4KB→Play 업로드 거부.
  // 동일 SFace ONNX 모델 추론이라 임베딩 값 불변(Java API OrtSession/OnnxTensor/addXnnpack 하위호환).
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"
  // EXIF 회전 처리 (원본을 upright 비트맵으로 디코드 → 검출좌표와 크롭좌표 일치).
  implementation "androidx.exifinterface:exifinterface:1.3.7"
}
